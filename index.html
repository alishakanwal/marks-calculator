<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Calculator</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: Arial, sans-serif;
    background-color: #eaf6ff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.main-container {
    width: 90%;
    max-width: 450px;
    text-align: center;
}
h1 {
    color: #2474b5;
    margin-bottom: 25px;
}
.calculator-card {
    background-color: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(36, 116, 181, 0.12);
}
label {
    display: block;
    text-align: left;
    color: #2474b5;
    font-weight: bold;
    margin-bottom: 7px;
    font-size: 14px;
}
input {
    width: 100%;
    padding: 13px;
    margin-bottom: 15px;
    border: 1px solid #b8ddf5;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
}
input:focus {
    border-color: #3298d5;
    box-shadow: 0 0 5px #b8e3ff;
}
.calc-btn {
    width: 100%;
    padding: 13px;
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}
.calc-btn:hover {
    background-color: #2474b5;
}
.result-box {
    margin-top: 20px;
    padding: 15px;
    background-color: #eff9ff;
    border-radius: 10px;
    color: #24577c;
    line-height: 2;
}
.result-box h2 {
    color: #2474b5;
    margin-bottom: 10px;
}
    </style>
</head>
<body>
    <div class="main-container">
        <h1>Marks Calculator 🎯</h1>
        <div class="calculator-card">
            <form id="marksForm">
                <label for="english">English</label>
                <input type="number" id="english" placeholder="English (out of 100)" min="0" max="100" required>
                <label for="urdu"> urdu</label>
                <input type="number" id="urdu" placeholder="Urdu (out of 100)" min="0" max="100" required>
                <label for="computer">computer</label>
                <input type="number" id="computer" placeholder="Computer (out of 100)" min="0" max="100" required>
                <label for="math">math</label>
                <input type="number" id="math" placeholder="Math (out of 100)" min="0" max="100" required>
                <button type="submit" class="calc-btn">Calculate 📈</button>
            </form>
            <div id="result" class="result-box"></div>
        </div>
    </div>
    <script>
let form = document.getElementById("marksForm");
form.addEventListener("submit", function(event) {
    event.preventDefault();
    let english = Number(document.getElementById("english").value);
    let urdu = Number(document.getElementById("urdu").value);
    let computer = Number(document.getElementById("computer").value);
    let math = Number(document.getElementById("math").value);
    let marks = [english, urdu, computer, math];
    let total = english + urdu + computer + math;
    let percentage = (total / 400) * 100;
    let grade;
    if (percentage >= 80) {
        grade = "A";
    }
    else if (percentage >= 60) {
        grade = "B";
    }
    else if (percentage >= 40) {
        grade = "C";
    }
    else {
        grade = "Fail";
    }
    let status;
    if (marks.every(mark => mark >= 40)) {
        status = "PASS";
    }
    else {
        status = "FAIL";
    }
    document.getElementById("result").innerHTML = `
        <h2>Student Result</h2>
        <p>Total Marks: ${total} / 400</p>
        <p>Percentage: ${percentage.toFixed(2)}%</p>
        <p>Grade: ${grade}</p>
        <h3>Result: ${status}</h3>
    `;
});
    </script>
